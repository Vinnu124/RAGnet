[project]
name = "ragnet"
version = "2.0.0"
description = "Fast, accurate, agentic RAG over local documents. Runs fully on your own GPU box with any OpenAI-compatible LLM server (vLLM, Ollama, llama.cpp)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "pymupdf4llm>=0.0.17",
    "tiktoken>=0.8",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Layout-aware parsing (tables, scanned PDFs / OCR). Heavy; install only if you need `--hifi`.
hifi = ["docling>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ragnet = "ragnet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragnet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
